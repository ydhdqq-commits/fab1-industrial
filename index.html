<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>INDUSUR.IND | Soluciones Metálicas Industriales | Ferreyra - Córdoba</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F10;--card:#17191C;--line:#22252A;--accent:#FF4D00;--text:#F2F2F0;--muted:#8E96A0}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
h1,h2,h3{font-family:Syne,sans-serif;font-weight:800;letter-spacing:-0.02em;text-transform:uppercase}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,15,16,.9);backdrop-filter:blur(10px);z-index:10}
.logo{font-family:Syne;font-weight:800;font-size:22px}.logo span{color:var(--accent)}
.btn{background:var(--accent);color:#000;padding:14px 26px;font-weight:800;text-decoration:none;border-radius:6px;display:inline-block}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;padding:70px 5%;align-items:center}
.hero h1{font-size:82px;line-height:.85}.hero h1 em{color:var(--accent);font-style:normal}
.hero p{color:var(--muted);margin:20px 0;max-width:520px;font-size:18px;line-height:1.5}
.stats{display:flex;gap:30px;margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.stats b{font-size:32px;display:block}.stats span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.img-hero{height:520px;background:url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=1200') center/cover;border-radius:12px;border:1px solid var(--line);position:relative}
.img-hero:after{content:"PLANTA 2000M² • FERREYRA • CÓRDOBA";position:absolute;bottom:12px;left:12px;background:#000;color:#fff;padding:8px 12px;font-size:11px;letter-spacing:.1em;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 5%}
.grid div{background:var(--card);padding:32px}.grid h3{font-size:18px;margin-bottom:8px}.grid p{color:var(--muted);font-size:14px;line-height:1.4}
.section{padding:70px 5%}.dark{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero h1{font-size:48px}.img-hero
